<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Pimpinan LPM - Universitas Andalas</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts Inter & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        unand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#006837', // Unand Primary Green
                            900: '#004d28',
                        },
                        gold: {
                            400: '#fbbf24',
                            500: '#f59e0b',
                            600: '#d97706',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Sembunyikan scrollbar untuk Chrome, Safari, dan Opera */
        ::-webkit-scrollbar {
            display: none;
        }
        /* Sembunyikan scrollbar untuk Firefox, IE, dan Edge */
        html, body, div {
            -ms-overflow-style: none;  /* IE dan Edge */
            scrollbar-width: none;  /* Firefox */
        }
        .glass-header {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(12px);
        }
        @keyframes toastIn {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes toastOut {
            from { transform: translateY(0); opacity: 1; }
            to { transform: translateY(100%); opacity: 0; }
        }
        .animate-toast-in {
            animation: toastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .animate-toast-out {
            animation: toastOut 0.2s cubic-bezier(0.7, 0, 0.84, 0) forwards;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Hero Banner Section -->
    <section class="relative bg-gradient-to-br from-unand-900 via-unand-800 to-emerald-900 text-white py-14 lg:py-18 overflow-hidden">
        <!-- Decorative Background Pattern -->
        <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#fff_1px,transparent_1px)] [background-size:16px_16px]"></div>
        <div class="absolute -right-20 -top-20 w-96 h-96 bg-yellow-500/20 rounded-full blur-3xl"></div>
        <div class="absolute -left-20 -bottom-20 w-96 h-96 bg-emerald-500/20 rounded-full blur-3xl"></div>

        <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="max-w-3xl">
                <h1 class="text-3xl sm:text-4xl lg:text-5xl font-extrabold tracking-tight leading-tight">
                    Profil Pimpinan <br class="hidden sm:inline"><span class="text-yellow-400">Lembaga Penjaminan Mutu</span>
                </h1>
            </div>
        </div>
    </section>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-[1400px] mx-auto w-full px-4 sm:px-6 lg:px-8 py-10" id="profil-pimpinan">
        
        <!-- Leader Profile Cards Grid (4 Columns Horizontal on Desktop) -->
        <div id="leaders-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- Dynamically loaded profile cards -->
        </div>

        <!-- No Results State -->
        <div id="no-results" class="hidden text-center py-16 bg-white rounded-2xl border border-dashed border-slate-300 my-6">
            <i class="fa-solid fa-user-slash text-4xl text-slate-300 mb-3 block"></i>
            <h3 class="text-base font-bold text-slate-700">Tidak ada data pimpinan yang cocok</h3>
            <p class="text-xs text-slate-500 mt-1">Coba gunakan kata kunci pencarian lain atau setel ulang filter.</p>
            <button onclick="resetFilters()" class="mt-4 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl transition-colors">
                <i class="fa-solid fa-rotate-left mr-1.5"></i> Reset Filter
            </button>
        </div>

    </main>

    <!-- Leader Detail Interactive Modal -->
    <div id="leader-modal" class="fixed inset-0 z-50 hidden bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4 sm:p-6 overflow-y-auto">
        <div class="relative bg-white rounded-3xl shadow-2xl max-w-3xl w-full my-8 overflow-hidden transform transition-all border border-slate-100 flex flex-col max-h-[90vh]">
            
            <!-- Modal Header / Photo Overlay -->
            <div class="relative bg-gradient-to-r from-unand-900 via-unand-800 to-emerald-900 text-white p-6 sm:p-8">
                <button onclick="closeLeaderModal()" class="absolute top-4 right-4 w-9 h-9 rounded-full bg-black/20 hover:bg-black/40 text-white flex items-center justify-center transition-all focus:outline-none">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>

                <div class="flex flex-col sm:flex-row items-center sm:items-start gap-5">
                    <img id="modal-image" src="" alt="" class="w-28 h-28 sm:w-32 sm:h-32 rounded-full object-cover object-top border-4 border-white/30 shadow-xl bg-slate-800 flex-shrink-0">
                    <div class="text-center sm:text-left space-y-2 overflow-hidden w-full">
                        <span id="modal-role" class="inline-block px-3 py-0.5 bg-yellow-400 text-slate-900 rounded-full text-[11px] font-extrabold uppercase tracking-wider shadow-sm"></span>
                        <h3 id="modal-name" class="text-base sm:text-lg font-extrabold text-white leading-snug break-words"></h3>
                        <p id="modal-academic" class="text-xs text-yellow-200 font-medium leading-relaxed break-words"></p>
                    </div>
                </div>
            </div>

            <!-- Modal Content Body -->
            <div class="p-6 sm:p-8 overflow-y-auto no-scrollbar flex-grow text-slate-700">
                <div class="flex items-center space-x-2 text-unand-800 font-bold border-b border-slate-200 pb-3 mb-5">
                    <i class="fa-solid fa-id-card text-base"></i>
                    <h4 class="text-xs sm:text-sm uppercase tracking-wider">Profil Lengkap</h4>
                </div>
                <div id="modal-narration-container" class="space-y-4 text-xs sm:text-sm leading-relaxed text-slate-700 text-justify">
                    <!-- Paragraphs populated dynamically -->
                </div>
            </div>

            <!-- Modal Footer Actions -->
            <div class="bg-slate-50 px-6 py-4 border-t border-slate-200 flex items-center justify-between">
                <button onclick="copyLeaderBio()" class="inline-flex items-center px-3.5 py-2 text-xs font-bold text-slate-700 bg-white border border-slate-300 rounded-xl hover:bg-slate-100 transition-colors shadow-sm active:scale-95">
                    <i class="fa-regular fa-copy mr-2 text-slate-500"></i> Salin Profil
                </button>
                <button onclick="closeLeaderModal()" class="px-5 py-2 text-xs font-bold text-white bg-unand-800 hover:bg-unand-900 rounded-xl transition-colors shadow-sm">
                    Tutup
                </button>
            </div>

        </div>
    </div>

    <!-- Custom Toast Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <script>
        const leadersData = [
            {
                id: 0,
                name: "Prof. dr. Hardisman, M.HID., Dr.PH.",
                role: "Ketua LPM",
                category: "pimpinan",
                academic: "Guru Besar / Profesor (Fakultas Kedokteran)",
                expertise: "Kesehatan Masyarakat, Kebijakan Kesehatan, Metodologi Penelitian",
                image: "hardisman.jpg",
                fallbackImage: "https://lpm.unand.ac.id/wp-content/uploads/2024/12/WhatsApp-Image-2024-06-14-at-10.44.09_a6c27bac-1-150x150.jpg",
                avatarFallback: "https://placehold.co/300x400/006837/ffffff?text=Prof+Hardisman",
                shortDesc: "Guru Besar Fakultas Kedokteran Unand yang aktif sebagai narasumber, konsultan kebijakan kesehatan, serta penulis produktif karya akademik dan literasi humanisme.",
                narration: [
                    "Prof. dr. Hardisman, M.HID., Dr.PH. adalah Profesor di Fakultas Kedokteran, Universitas Andalas. Dia meraih gelar kedokterannya (dokter—dr) di tempatnya mengabdi, dan menyelesaikan studi Magister serta Doktor (Doctor of Public Health—Dr.PH.) di Flinders University, Australia. Dia pernah mengikuti pelatihan di Harvard University of Public Health (HSPH) Boston, US melalui short course dan short fellowship, serta SEAOHUN-ILRI fellow di Vietnam dan Thailand.",
                    "Selain itu, dia juga aktif sebagai narasumber dan konsultan dalam bidang kesehatan masyarakat dan kebijakan kesehatan di berbagai pemerintah daerah.",
                    "Prof. Hardisman telah menghasilkan banyak karya, dengan menulis lebih dari 25 buku akademik tentang kesehatan masyarakat, kebijakan kesehatan, dan metodologi penelitian yang beredara nasional. Dia juga telah menghasilkan beberapa karya sastra berupa novel dan buku kumpulan puisi dan yang memadukan ilmu pengetahuan dengan humanisme, dengan misi hidupnya menjembatani pengetahuan dengan kebijaksanaan yang membumi dan senantiasa bisa berbuat baik dengan menjalani hidup dengan penuh makna. Saat ini Prof. Hardisman adalah Ketua Lembaga Penjaminan Mutu (LPM) Universitas Andalas. Sebelumnya, dalam bidang manajerial ia pernah memegang jabatan di institusi pendidikan mulai dari ketua program studi dan wakil dekan."
                ]
            },
            {
                id: 1,
                name: "Dr. Elly Delfia, S.S., M.Hum.",
                role: "Sekretaris LPM",
                category: "pimpinan",
                academic: "Dosen Prodi Sastra Indonesia & S2 Linguistik",
                expertise: "Linguistik, Analisis Wacana Kritis",
                image: "elly delfia.jpg",
                fallbackImage: "https://lpm.unand.ac.id/wp-content/uploads/2024/12/WhatsApp-Image-2024-02-23-at-14.40.17_3df56426-150x150.jpg",
                avatarFallback: "https://placehold.co/300x400/006837/ffffff?text=Dr+Elly+Delfia",
                shortDesc: "Pakar Ilmu Linguistik alumni UGM yang berperan aktif memberikan pendampingan teknis dan strategis dalam Audit Mutu Internal, GPM/GKM, serta Akreditasi.",
                narration: [
                    "Dr. Elly Delfia, S.S., M.Hum. merupakan Sekretaris Lembaga Penjaminan Mutu Universitas Andalas, yang berperan dalam memberikan pendampingan tentang kegiatan penjaminan mutu, seperti audit mutu internal, pendampingan GPM/GKM, serta akreditasi nasional dan internasional. Dosen Prodi Sastra Indonesia dan S2 Linguistik ini merupakan alumni Program Doktor S-3 Ilmu-Ilmu Humaniora Universitas Gadjah Mada yang pakar di bidang ilmu linguistik, khususnya analisis wacana kritis. Ia menulis beberapa judul buku terkait dengan kepakaran, seperti <em>Linguistik dalam Bingkai Kekinian</em> (2019), <em>Bahasa Indonesia untuk SMP/MTs Kemdikbudristek</em> (2024), <em>Bahasa Indonesia Praktis</em> (2025), dan <em>Pendekatan Terkini Analisis Wacana dan Analisis Wacana Kritis</em> (2025)."
                ]
            },
            {
                id: 2,
                name: "Prof. Ir. Denny Helard, S.T., M.T., Ph.D.",
                role: "Kabag SPMI LPM",
                category: "spmi",
                academic: "Guru Besar / Profesor (Teknik Lingkungan)",
                expertise: "Pengelolaan Air Limbah, Pemantauan Kualitas Air, Perancangan & Optimalisasi WWTP",
                image: "denny helard.jpg",
                fallbackImage: "https://lpm.unand.ac.id/wp-content/uploads/2026/07/prof-denny.jpg",
                avatarFallback: "https://placehold.co/300x400/006837/ffffff?text=Prof+Denny+Helard",
                shortDesc: "Guru Besar Teknik Lingkungan alumni ITB dan Gifu University Jepang, bertindak sebagai Kabag SPMI serta Asesor Nasional LAM-Teknik dan Internasional IABEE.",
                narration: [
                    "Prof. Ir. Denny Helard, S.T., M.T., Ph.D. adalah Guru Besar di bidang Teknik Lingkungan yang diakui sebagai pakar dalam pengelolaan air limbah serta pemantauan kualitas air. Keahlian utamanya mencakup perancangan dan optimalisasi <em>wastewater treatment plant</em> (WWTP). Beliau menempuh pendidikan sarjana (S.T. 1998) dan magister (M.T. 2003) di Teknik Lingkungan Institut Teknologi Bandung (ITB), sebelum meraih gelar doktor (Ph.D.) dari Gifu University, Jepang, pada tahun 2013. Fokus penelitian doktoralnya adalah pengembangan metode inovatif untuk pemantauan kualitas air serta peningkatan proses dan mutu pengolahan air limbah.",
                    "Sebagai akademisi, dalam bidang penjaminan mutu pendidikan perguruan tinggi, Prof. Denny saat ini adalah Kabag SPME di Lembaga Penjaminan Mutu Universitas Andalas. Dia juga salah satu asesor nasional untuk LAM-Teknik dan Lembaga Akreditasi Internasional IABEE (Indonesia Accreditation Board for Engineering Education)."
                ]
            },
            {
                id: 3,
                name: "Dr. Devi Analia, S.P., M.Si.",
                role: "Kabag SPME LPM",
                category: "spme",
                academic: "Lektor Kepala (S2 Pembangunan Wilayah & Perdesaan)",
                expertise: "Perencanaan Pembangunan Perdesaan Berbasis Agribisnis, Modal Sosial & Kelembagaan",
                image: "devi analia.jpg",
                fallbackImage: "https://lpm.unand.ac.id/wp-content/uploads/2024/12/Devi-Analia-150x150.jpg",
                avatarFallback: "https://placehold.co/300x400/006837/ffffff?text=Dr+Devi+Analia",
                shortDesc: "Pakar perencanaan pembangunan perdesaan lulusan IPB yang bertindak sebagai Kabag SPME LPM Unand, memfasilitasi penjaminan mutu eksternal & akreditasi.",
                narration: [
                    "Dr. Devi Analia, S.P., M.Si. adalah seorang Lektor Kepala di Program Studi S2 Pembangunan Wilayah dan Perdesaan yang memiliki kepakaran dalam bidang perencanaan pembangunan wilayah perdesaan berbasis agribisnis, modal sosial dan kelembagaan. Beliau menyelesaikan pendidikan sarjana di bidang Agribisnis pada tahun 2006 di Universitas Andalas, kemudian melanjutkan studi magister dan doktor di Institut Pertanian Bogor (IPB) yang sama dalam bidang Studi Pembangunan dengan fokus pada perencanaan pembangunan wilayah pedesaan. Melalui riset, publikasi, dan kegiatan pengabdian masyarakat, beliau turut mendorong terbentuknya model pembangunan yang inklusif dan berkeadilan, terutama bagi sektor UMKM dan komunitas agribisnis di pedesaan. Integrasi antara teori pembangunan dan praktik lapangan menjadikan Dr. Devi sebagai akademisi yang visioner dan kontributif dalam memperkuat kapasitas wilayah perdesaan menuju kemandirian dan kesejahteraan berkelanjutan."
                ]
            }
        ];

        let activeLeaderIndex = 0;

        function renderLeaders() {
            const grid = document.getElementById('leaders-grid');
            grid.innerHTML = '';

            leadersData.forEach((leader) => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-lg transition-all duration-300 overflow-hidden flex flex-col justify-between group p-3.5 sm:p-4";
                
                card.innerHTML = `
                    <div class="space-y-3">
                        <!-- Circular Photo Container with Role Centered Above -->
                        <div class="flex flex-col items-center justify-center pt-1 pb-1">
                            <span class="mb-2 bg-yellow-400 text-slate-900 text-[10px] font-extrabold px-3 py-0.5 rounded-md uppercase tracking-wider shadow text-center">
                                ${leader.role}
                            </span>
                            <div class="w-32 h-32 sm:w-36 sm:h-36 rounded-full overflow-hidden border-4 border-unand-800/20 shadow-md bg-slate-100 flex-shrink-0">
                                <img src="${leader.image}" onerror="this.onerror=null; this.src='${leader.fallbackImage}'; this.onerror=function(){this.src='${leader.avatarFallback}'};" alt="${leader.name}" class="w-full h-full object-cover object-top transform group-hover:scale-105 transition-transform duration-300">
                            </div>
                        </div>

                        <!-- Single Line Compact Name & Academic Title -->
                        <div class="space-y-1 text-center">
                            <h3 class="text-[9px] sm:text-[10px] lg:text-[10.5px] font-extrabold tracking-tight text-slate-900 leading-tight whitespace-nowrap overflow-hidden text-ellipsis" title="${leader.name}">${leader.name}</h3>
                            <p class="text-[8.5px] sm:text-[9.5px] lg:text-[10px] font-semibold tracking-tight text-unand-800 leading-tight whitespace-nowrap overflow-hidden text-ellipsis" title="${leader.academic}">${leader.academic}</p>
                        </div>
                    </div>

                    <!-- Card Action Footer -->
                    <div class="pt-3 mt-3 border-t border-slate-100 flex items-center justify-between">
                        <span class="text-xs font-bold text-unand-800 group-hover:underline cursor-pointer" onclick="openLeaderModal(${leader.id})">
                            Detail Profil Lengkap
                        </span>
                        <button onclick="openLeaderModal(${leader.id})" aria-label="Lihat Detail Profil ${leader.name}" class="w-7 h-7 rounded-lg bg-unand-800 hover:bg-unand-900 text-white flex items-center justify-center transition-colors shadow-sm focus:outline-none">
                            <i class="fa-solid fa-arrow-right text-[10px]"></i>
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openLeaderModal(id) {
            activeLeaderIndex = id;
            const leader = leadersData.find(item => item.id === id);
            if (!leader) return;

            // Header Elements
            const modalImg = document.getElementById('modal-image');
            modalImg.src = leader.image;
            modalImg.onerror = function() {
                this.onerror = function() {
                    this.src = leader.avatarFallback;
                };
                this.src = leader.fallbackImage;
            };

            document.getElementById('modal-role').innerText = leader.role;
            const nameElem = document.getElementById('modal-name');
            nameElem.innerText = leader.name;
            document.getElementById('modal-academic').innerText = leader.academic;

            // Populate Paragraph Narration
            const narrationContainer = document.getElementById('modal-narration-container');
            narrationContainer.innerHTML = leader.narration.map(paragraph => `<p>${paragraph}</p>`).join('');

            // Display Modal
            const modal = document.getElementById('leader-modal');
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeLeaderModal() {
            const modal = document.getElementById('leader-modal');
            modal.classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function copyLeaderBio() {
            const leader = leadersData.find(item => item.id === activeLeaderIndex);
            if (!leader) return;

            const cleanTextNarration = leader.narration.map(p => p.replace(/<[^>]*>?/gm, '')).join('\n\n');
            const bioText = `${leader.name}\n${leader.role} - Universitas Andalas\n${leader.academic}\n\nNARASI PROFIL:\n${cleanTextNarration}`;

            // Temporary textarea fallback for iFrame compatibility
            const tempInput = document.createElement('textarea');
            tempInput.value = bioText;
            document.body.appendChild(tempInput);
            tempInput.select();
            
            try {
                document.execCommand('copy');
                showToast(`Profil ${leader.name} berhasil disalin!`, 'success');
            } catch (err) {
                showToast('Gagal menyalin profil.', 'error');
            }
            
            document.body.removeChild(tempInput);
        }

        // Custom Toast Notification Function
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const bgColor = type === 'success' ? 'bg-slate-900 text-white border-emerald-500' : 'bg-slate-900 text-white border-red-500';
            const icon = type === 'success' ? 'fa-circle-check text-emerald-400' : 'fa-circle-exclamation text-red-400';

            toast.className = `pointer-events-auto flex items-center space-x-3 px-4 py-3 rounded-xl shadow-xl border-l-4 ${bgColor} text-xs font-semibold animate-toast-in`;
            toast.innerHTML = `
                <i class="fa-solid ${icon} text-sm"></i>
                <span>${message}</span>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('animate-toast-in');
                toast.classList.add('animate-toast-out');
                setTimeout(() => {
                    if (toast.parentNode) {
                        toast.parentNode.removeChild(toast);
                    }
                }, 200);
            }, 3000);
        }

        // Event Listeners Initialization
        document.addEventListener('DOMContentLoaded', () => {
            renderLeaders();

            // Close Modal on Backdrop Click
            const modal = document.getElementById('leader-modal');
            if (modal) {
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) {
                        closeLeaderModal();
                    }
                });
            }

            // Close Modal on Escape Key
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeLeaderModal();
                }
            });
        });
    </script>
</body>
</html>
